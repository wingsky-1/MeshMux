name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check gofmt
        run: |
          test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Build
        run: go build -o /tmp/meshmux ./cmd/meshmux
      - name: CLI must fail closed before installer exists
        run: |
          if /tmp/meshmux install hub; then
            echo 'unimplemented install unexpectedly succeeded' >&2
            exit 1
          fi
