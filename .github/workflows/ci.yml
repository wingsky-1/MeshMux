name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      # Single gate: gofmt -s, go vet, staticcheck (pinned), go test,
      # go test -race and both builds. The commands live in the Makefile so
      # local runs and CI cannot drift; the build step below still consumes
      # /tmp/meshmux and /tmp/meshmux-web, which `make verify` produces.
      - name: Verify
        run: make verify
      # These three invariants hold for every implementation stage of the
      # installer. They assert the system's refusal properties, not the
      # absence of an implementation: no configuration means no host changes,
      # and a failed preflight blocks apply even under --yes.
      - name: CLI must not modify host without explicit consent
        run: |
          set -Eeuo pipefail
          domains=(--management-domain console.example.org
                   --subscription-domain sub.example.org
                   --headscale-domain mesh.example.org)

          # Invariant 1: no configuration => refuse before planning or side effects.
          set +e
          /tmp/meshmux install hub </dev/null >/tmp/no-domain.out 2>/tmp/no-domain.err
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::install hub succeeded without any configuration" >&2
            exit 1
          fi
          grep -q '^CONFIG_REQUIRED' /tmp/no-domain.err

          # Invariant 2: failed preflight blocks apply even with --yes.
          # This runner is non-root and not Debian 13, so preflight cannot pass.
          set +e
          /tmp/meshmux install hub --yes "${domains[@]}" </dev/null >/tmp/yes.json 2>/tmp/yes.err
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::install hub --yes applied on a host that failed preflight" >&2
            exit 1
          fi
          python3 -c "import json;d=json.load(open('/tmp/yes.json'));assert d['status']=='preflight_blocked',d['status'];assert d['apply_available'] is False,d['apply_available']"

          # Invariant 3: neither refusing invocation may touch the host.
          for p in /run/lock/meshmux-install.lock \
                   /var/lib/meshmux-installer \
                   /var/cache/meshmux-installer \
                   /etc/meshmux \
                   /etc/fail2ban/jail.d/meshmux-ssh.local \
                   /usr/local/libexec/meshmuxd; do
            if [ -e "$p" ]; then
              echo "::error::install left host state behind without consent: $p" >&2
              exit 1
            fi
          done
          echo "install CLI refused as expected and left no host state"

  web-preview:
    # Real browser evidence runs here because restricted local containers may
    # have no non-root UID or browser sockets. No production credentials/services.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated Web
        run: go build -o /tmp/meshmux-web ./cmd/meshmux-web
      - name: Prepare browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/meshmux-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/meshmux-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Browser flow and responsive screenshots
        env:
          NODE_PATH: ${{ runner.temp }}/meshmux-browser/node_modules
        run: node scripts/browser-smoke.cjs
      - name: Upload review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: artifacts/web-preview/*.png
          retention-days: 14
          if-no-files-found: error
