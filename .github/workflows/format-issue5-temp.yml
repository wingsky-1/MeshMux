name: format-issue5-temp
on:
  push:
    branches: [feat/issue5-hub-preflight-locks]
permissions:
  contents: write
jobs:
  format:
    if: github.actor == 'wingsky-1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue5-hub-preflight-locks
          persist-credentials: true
      - name: Apply gofmt to Phase 2A source
        run: |
          gofmt -w cmd/meshmux/main.go internal/install/*.go
          git add cmd/meshmux/main.go internal/install
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(installer): gofmt Phase 2A implementation"
            git push origin HEAD:feat/issue5-hub-preflight-locks
          fi
