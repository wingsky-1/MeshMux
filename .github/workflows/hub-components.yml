name: hub-components
on:
  pull_request:
    paths:
      - 'internal/install/**'
      - 'internal/node/**'
      - 'internal/agent/**'
      - 'internal/web/**'
      - 'cmd/meshmux/**'
      - 'cmd/meshmux-web/**'
      - '.github/workflows/hub-components.yml'
      - 'scripts/ci-hub-components.sh'
      - 'scripts/ci-node-components.sh'
      - 'scripts/ci-node-reality.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian13:
    name: Debian 13 component validation (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build isolated fixture and Web binaries
        run: |
          mkdir -p .ci/bin
          go test -c -o .ci/bin/install.test ./internal/install
          go test -c -o .ci/bin/node.test ./internal/node
          go test -c -o .ci/bin/web.test ./internal/web
          go build -o .ci/bin/meshmux-web ./cmd/meshmux-web
          go build -o .ci/bin/meshmux ./cmd/meshmux
          (cd .ci/bin && sha256sum meshmux > SHA256SUMS)
      - name: Debian 13 official component configuration checks
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:13 bash /workspace/scripts/ci-hub-components.sh
      - name: Debian 13 Node component configuration checks (Issue #6 PR-B L2)
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            --privileged \
            debian:13 bash /workspace/scripts/ci-node-components.sh
      - name: Debian 13 native REALITY acceptance fixture (Issue #7 first PR L2)
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e DEBIAN_FRONTEND=noninteractive \
            -e RUNNER_TEMP=/tmp \
            debian:13 bash -c '
              apt-get update &&
              apt-get install -y --no-install-recommends ca-certificates curl tar gzip coreutils &&
              bash scripts/ci-node-reality.sh
            '
      - name: Upload reviewable installer and source-bound checksum
        uses: actions/upload-artifact@v4
        with:
          name: hub-installer-${{ matrix.arch }}
          path: |
            .ci/bin/meshmux
            .ci/bin/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
