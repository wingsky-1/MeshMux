name: hub-vm

on:
  # L3 is the acceptance gate for the installer. Run it on the PR itself:
  # otherwise every later commit merges with no full-system evidence.
  pull_request:
    paths:
      - 'internal/install/**'
      - 'cmd/meshmux/**'
      - 'cmd/meshmux-web/**'
      - 'scripts/ci-hub-vm.sh'
      - '.github/workflows/hub-vm.yml'
      - 'docs/CI_HUB_VALIDATION.zh-CN.md'
      - 'docs/ACCEPTANCE.zh-CN.md'
      - 'docs/INSTALL_HUB.zh-CN.md'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to verify'
        required: false
        default: 'main'
        type: string
  push:
    branches:
      - 'verify/issue5-hub-vm-*'

permissions:
  contents: read

jobs:
  debian13-systemd:
    name: Debian 13 QEMU systemd full install
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout verified ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build production CLI and VM-only integration test
        run: |
          mkdir -p .ci/bin
          CGO_ENABLED=0 go build -o .ci/bin/meshmux ./cmd/meshmux
          go test -c -o .ci/bin/install.test ./internal/install
      - name: Install QEMU and cloud-init image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils openssh-client
      - name: Boot official Debian 13 and verify Hub install, repair and reboot
        run: bash scripts/ci-hub-vm.sh
      - name: Keep VM serial console on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hub-vm-serial
          path: ${{ runner.temp }}/meshmux-hub-vm/serial.log
          retention-days: 7
          if-no-files-found: warn
